<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>中韩翻译</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  color:#e0e0e0;min-height:100dvh;display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding:16px;
}
.header{text-align:center;margin-bottom:12px}
.header h1{font-size:22px;font-weight:700}
.header .sub{font-size:12px;color:#8892b0;margin-top:2px}

.modes{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;padding:12px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8892b0;font-size:14px;font-weight:600;text-align:center;cursor:pointer;transition:.2s}
.mode-btn.active{border-color:#e94560;background:rgba(233,69,96,.15);color:#fff;box-shadow:0 0 16px rgba(233,69,96,.12)}
.mode-btn .em{font-size:22px;display:block;margin-bottom:3px}

.hint{padding:12px 14px;background:rgba(240,160,88,.08);border:1px solid rgba(240,160,88,.2);border-radius:12px;font-size:12px;color:#f0a058;text-align:center;margin-bottom:14px;line-height:1.6}
.hint strong{color:#fff}

.input-row{display:flex;gap:8px;margin-bottom:14px}
.input-row input{flex:1;padding:16px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:18px;outline:none;transition:border .2s}
.input-row input:focus{border-color:rgba(240,160,88,.5)}
.input-row input::placeholder{color:#555;font-size:15px}
.input-row button{flex:0 0 auto;padding:16px 22px;border-radius:14px;border:none;background:#e94560;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.input-row button:active{background:#c03950;transform:scale(.96)}

.result{background:rgba(233,69,96,.06);border-radius:16px;padding:16px;border:1px solid rgba(233,69,96,.12);margin-bottom:14px;display:none}
.result .rl{font-size:11px;color:#e94560;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.result .rt{font-size:18px;line-height:1.5;word-break:break-word}
.result .ra{display:flex;gap:8px;margin-top:12px}
.result .ra button{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e0e0e0;font-size:14px;cursor:pointer;transition:.2s}
.result .ra button:active{background:rgba(255,255,255,.1)}
.result .ra button.pri{background:#e94560;border-color:#e94560;font-weight:600}

.spk-playing{animation:spkPulse .6s infinite}
@keyframes spkPulse{0%,100%{opacity:1}50%{opacity:.5}}

.hist{margin-top:auto}
.hist-h{font-size:12px;color:#8892b0;margin-bottom:6px;display:flex;justify-content:space-between}
.hist-clr{color:#e94560;cursor:pointer;font-size:11px}
.hist-item{background:rgba(255,255,255,.03);border-radius:10px;padding:10px;margin-bottom:4px;border:1px solid rgba(255,255,255,.04);cursor:pointer}
.hist-item .orig{font-size:13px;color:#aaa}
.hist-item .tran{font-size:15px;color:#fff;margin-top:3px;font-weight:500}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>中韩翻译</h1>
  <div class="sub">输入文字 · 一键翻译 · 朗读播放</div>
</div>

<div class="modes">
  <button class="mode-btn active" onclick="setMode('ko2zh')" id="mKo2zh">
    <span class="em">🇰🇷→🇨🇳</span>韩译中
  </button>
  <button class="mode-btn" onclick="setMode('zh2ko')" id="mZh2ko">
    <span class="em">🇨🇳→🇰🇷</span>中译韩
  </button>
</div>

<div class="hint" id="hint">
  💡 <strong>点输入框 → 按键盘 🎤 → 说话</strong> → 自动输入文字 → 点翻译
</div>

<div class="input-row">
  <input type="text" id="inp" placeholder="输入文字，或按键盘🎤说话...">
  <button onclick="go()">翻译</button>
</div>

<div class="result" id="result">
  <div class="rl" id="rl">翻译结果</div>
  <div class="rt" id="rt"></div>
  <div class="ra">
    <button onclick="copyR()">📋 复制</button>
    <button class="pri" id="spkBtn" onclick="speakR()">🔊 朗读</button>
  </div>
</div>

<div class="hist" id="histWrap" style="display:none">
  <div class="hist-h"><span>记录</span><span class="hist-clr" onclick="clearHist()">清空</span></div>
  <div id="histList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let mode='ko2zh',cur='';
let hist=[];try{hist=JSON.parse(localStorage.getItem('kt3_hist')||'[]')}catch(e){}

function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function setMode(m){
  mode=m;
  document.getElementById('mKo2zh').classList.toggle('active',m==='ko2zh');
  document.getElementById('mZh2ko').classList.toggle('active',m==='zh2ko');
  document.getElementById('hint').innerHTML=m==='ko2zh'
    ?'💡 <strong>店员说韩语时</strong>：输入韩文 → 翻译成中文'
    :'💡 <strong>你说中文时</strong>：输入中文 → 翻译成韩文 → 自动朗读';
}

async function go(){
  const text=document.getElementById('inp').value.trim();
  if(!text){toast('请输入文字');return}
  const from=mode==='ko2zh'?'ko':'zh-CN';
  const to=mode==='ko2zh'?'zh-CN':'ko';
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const t=d[0].map(s=>s[0]).join('');
    cur=t;
    showResult(t,text);
    document.getElementById('inp').value='';
    if(mode==='zh2ko') setTimeout(()=>speakR(),300);
  }catch(e){toast('翻译失败: '+e.message)}
}

function showResult(translated,orig){
  document.getElementById('result').style.display='block';
  document.getElementById('rl').textContent=mode==='ko2zh'?'中文翻译':'한국어 번역';
  document.getElementById('rt').textContent=translated;
  addHist(orig,translated);
}

// TTS: Browser native first (best on Chrome) → Google TTS fallback
async function speakR(){
  if(!cur){toast('没有翻译结果');return}
  const btn=document.getElementById('spkBtn');
  btn.textContent='🔊 播放中...';btn.classList.add('spk-playing');
  const done=()=>{btn.textContent='🔊 朗读';btn.classList.remove('spk-playing')};
  
  // Method 1: Browser SpeechSynthesis (Chrome has great Korean/Chinese voices)
  try{
    const s=window.speechSynthesis;
    if(!s)throw new Error('no synth');
    s.cancel();
    const u=new SpeechSynthesisUtterance(cur);
    u.lang=mode==='zh2ko'?'ko-KR':'zh-CN';u.rate=0.85;
    const v=s.getVoices();
    if(v.length){const vv=v.find(x=>x.lang.startsWith(mode==='zh2ko'?'ko':'zh'));if(vv)u.voice=vv}
    await new Promise((resolve,reject)=>{
      u.onend=resolve;u.onerror=()=>reject('tts error');
      s.speak(u);
    });
    done();return;
  }catch(e){console.log('Browser TTS:',e)}
  
  // Method 2: Google Translate TTS
  try{
    const tl=mode==='zh2ko'?'ko':'zh-CN';
    const a=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=${tl}&client=gtx&q=${encodeURIComponent(cur)}`);
    await new Promise((resolve,reject)=>{
      a.onended=resolve;a.onerror=reject;
      a.play().catch(reject);
    });
    done();return;
  }catch(e){console.log('Google TTS:',e)}
  
  done();toast('朗读失败')
}

// History
function addHist(o,t){hist.unshift({orig:o,tran:t,mode,time:Date.now()});if(hist.length>20)hist.length=20;try{localStorage.setItem('kt3_hist',JSON.stringify(hist))}catch(e){}renderHist()}
function renderHist(){const w=document.getElementById('histWrap'),l=document.getElementById('histList');if(!hist.length){w.style.display='none';return}w.style.display='block';l.innerHTML=hist.slice(0,8).map(h=>`<div class="hist-item" onclick="replay('${h.tran.replace(/'/g,"\\'")}')"><div class="orig">${h.orig}</div><div class="tran">${h.tran}</div></div>`).join('')}
function replay(t){cur=t;document.getElementById('result').style.display='block';document.getElementById('rt').textContent=t}
function clearHist(){hist=[];localStorage.removeItem('kt3_hist');renderHist()}
function copyR(){if(!cur)return;navigator.clipboard.writeText(cur).then(()=>toast('已复制')).catch(()=>toast('复制失败'))}

// Init
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
const s=window.speechSynthesis;if(s){s.getVoices();if(s.onvoiceschanged!==undefined)s.onvoiceschanged=()=>s.getVoices()}
document.getElementById('inp').focus();
renderHist();
</script>
</body>
</html>
