<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>中韩翻译</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  color:#e0e0e0;display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
.header{text-align:center;padding:16px 12px 4px;flex-shrink:0}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:11px;color:#8892b0;margin-top:2px}

.modes{display:flex;gap:6px;padding:8px 14px;flex-shrink:0}
.mode-btn{flex:1;padding:10px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8892b0;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:.2s}
.mode-btn.active{border-color:#e94560;background:rgba(233,69,96,.15);color:#fff;box-shadow:0 0 15px rgba(233,69,96,.15)}
.mode-btn .emoji{font-size:20px;display:block;margin-bottom:2px}

.main{flex:1;overflow-y:auto;padding:0 14px;-webkit-overflow-scrolling:touch}

/* Input area */
.input-area{display:flex;gap:8px;margin:8px 0}
.input-area input{flex:1;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:17px;outline:none}
.input-area input::placeholder{color:#555}
.input-area button{flex:0 0 auto;padding:14px 18px;border-radius:14px;border:none;background:#e94560;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.input-area button:active{opacity:.8}

/* Voice record button */
.rec-wrap{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0}
.rec-btn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s;position:relative}
.rec-btn svg{width:28px;height:28px;fill:#8892b0;transition:.3s}
.rec-btn.recording{border-color:#e94560;background:rgba(233,69,96,.2);animation:pulse 1.2s infinite}
.rec-btn.recording svg{fill:#e94560}
.rec-label{font-size:12px;color:#8892b0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)}50%{box-shadow:0 0 0 16px rgba(233,69,96,0)}}

/* Result */
.result-area{background:rgba(233,69,96,.08);border-radius:16px;padding:14px;margin:8px 0;border:1px solid rgba(233,69,96,.15);display:none}
.result-label{font-size:11px;color:#e94560;letter-spacing:1px;margin-bottom:6px}
.result-text{font-size:18px;line-height:1.5;word-break:break-word;min-height:24px}

.result-actions{display:flex;gap:6px;margin-top:10px}
.ract{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e0e0e0;font-size:13px;cursor:pointer;text-align:center;transition:.2s}
.ract:active{background:rgba(255,255,255,.1)}
.ract.primary{background:#e94560;border-color:#e94560;font-weight:600}

/* Status bar */
.status{text-align:center;font-size:11px;color:#8892b0;padding:4px 0;min-height:20px}

/* History */
.hist{margin:8px 0 16px}
.hist-h{font-size:12px;color:#8892b0;margin-bottom:6px;display:flex;justify-content:space-between}
.hist-clr{color:#e94560;cursor:pointer;font-size:11px}
.hist-item{background:rgba(255,255,255,.03);border-radius:10px;padding:10px;margin-bottom:5px;border:1px solid rgba(255,255,255,.04);cursor:pointer}
.hist-item .orig{font-size:13px;color:#aaa}
.hist-item .tran{font-size:15px;color:#fff;margin-top:3px;font-weight:500}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

.debug{font-size:9px;color:#444;text-align:center;margin-top:4px;word-break:break-all}
</style>
</head>
<body>

<div class="header">
  <h1>中韩翻译</h1>
  <div class="sub">键盘🎤说话 · 自动翻译 · 朗读</div>
</div>

<div class="modes">
  <button class="mode-btn active" onclick="setMode('ko2zh')" id="mKo2zh">
    <span class="emoji">🇰🇷→🇨🇳</span>韩语→中文
  </button>
  <button class="mode-btn" onclick="setMode('zh2ko')" id="mZh2ko">
    <span class="emoji">🇨🇳→🇰🇷</span>中文→韩语
  </button>
</div>

<div class="main">
  <div class="status" id="status">输入文字或按🎤录音</div>

  <!-- Text input -->
  <div class="input-area">
    <input type="text" id="textInput" placeholder="输入文字或按键盘🎤语音...">
    <button onclick="translateText()">翻译</button>
  </div>

  <!-- Voice record button -->
  <div class="rec-wrap">
    <button class="rec-btn" id="recBtn" onclick="toggleRec()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <div class="rec-label" id="recLabel">按住录音</div>
  </div>

  <!-- Result -->
  <div class="result-area" id="resultArea">
    <div class="result-label" id="resultLabel">翻译结果</div>
    <div class="result-text" id="resultText"></div>
    <div class="result-actions">
      <button class="ract" onclick="copyResult()">复制</button>
      <button class="ract primary" id="speakBtn" onclick="speakResult()">🔊 朗读</button>
    </div>
  </div>

  <!-- History -->
  <div class="hist" id="histWrap" style="display:none">
    <div class="hist-h"><span>记录</span><span class="hist-clr" onclick="clearHist()">清空</span></div>
    <div id="histList"></div>
  </div>

  <div class="debug" id="debug"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let mode='ko2zh', mediaRecorder=null, audioChunks=[], isRec=false;
let currentResult='';
let hist=[]; try{hist=JSON.parse(localStorage.getItem('kt2_hist')||'[]')}catch(e){hist=[]}

function log(s){document.getElementById('debug').textContent=s;console.log(s)}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}

// ===== MODE =====
function setMode(m){
  mode=m;
  document.getElementById('mKo2zh').classList.toggle('active',m==='ko2zh');
  document.getElementById('mZh2ko').classList.toggle('active',m==='zh2ko');
  document.getElementById('status').textContent=m==='ko2zh'?'听韩语→显示中文':'说中文→翻译韩语+朗读';
  log('Mode: '+m);
}

// ===== TEXT TRANSLATE =====
async function translateText(){
  const text=document.getElementById('textInput').value.trim();
  if(!text){toast('请输入文字');return;}
  log('Translating: '+text);
  await doTranslate(text);
  document.getElementById('textInput').value='';
}

async function doTranslate(text){
  const from=mode==='ko2zh'?'ko':'zh-CN';
  const to=mode==='ko2zh'?'zh-CN':'ko';

  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const resp=await fetch(url);
    const data=await resp.json();
    const translated=data[0].map(s=>s[0]).join('');

    currentResult=translated;
    document.getElementById('resultArea').style.display='block';
    document.getElementById('resultLabel').textContent=mode==='ko2zh'?'中文翻译':'한국어 번역';
    document.getElementById('resultText').textContent=translated;
    addHist(text,translated);

    log('Translated: '+translated);

    // Auto-speak Korean in zh2ko mode
    if(mode==='zh2ko'&&translated.trim()){
      setTimeout(()=>speak(translated,'ko'),200);
    }
  }catch(e){
    log('Translate error: '+e.message);
    toast('翻译失败，请重试');
  }
}

// ===== VOICE RECORD =====
async function toggleRec(){
  if(isRec){stopRec();return;}
  await startRec();
}

async function startRec(){
  try{
    log('Requesting mic...');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
    audioChunks=[];

    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};

    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      log('Recording done: '+blob.size+' bytes');
      await sendAudioForSTT(blob);
    };

    mediaRecorder.start();
    isRec=true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recLabel').textContent='录音中...松手停止';
    document.getElementById('status').textContent='🎙️ 正在录音...';
    log('Recording...');
  }catch(e){
    log('Mic error: '+e.message);
    toast('无法访问麦克风: '+e.message);
  }
}

function stopRec(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
  }
  isRec=false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recLabel').textContent='按住录音';
  document.getElementById('status').textContent='处理中...';
  log('Stopped recording');
}

// ===== SEND AUDIO FOR STT =====
async function sendAudioForSTT(blob){
  log('Sending audio for STT...');
  document.getElementById('status').textContent='识别中...';

  try{
    // Convert to base64
    const reader=new FileReader();
    const base64=await new Promise((resolve,reject)=>{
      reader.onload=()=>resolve(reader.result.split(',')[1]);
      reader.onerror=reject;
      reader.readAsDataURL(blob);
    });

    // Try Google Speech-to-Text v1 REST (free tier, no API key for short audio via Chrome variant)
    // First try: Google's speech recognition endpoint
    const lang=mode==='ko2zh'?'ko-KR':'zh-CN';
    
    // Use Google's STT endpoint (works without API key for short audio)
    const resp=await fetch(`https://www.google.com/speech-api/v2/recognize?output=json&lang=${lang}&key=AIzaSyBOti4mM-6x9WDnZIjIeyEU21OpBXqWBgw`,{
      method:'POST',
      headers:{'Content-Type':'audio/webm;codecs=opus'},
      body:blob
    });

    const text=await resp.text();
    log('STT raw: '+text.substring(0,100));

    // Parse response
    let transcript='';
    try{
      // Response is JSON lines
      const lines=text.split('\n').filter(l=>l.trim());
      for(const line of lines){
        const parsed=JSON.parse(line);
        if(parsed.result&&parsed.result[0]&&parsed.result[0].alternative){
          transcript=parsed.result[0].alternative[0].transcript||'';
          break;
        }
      }
    }catch(e){
      log('Parse error: '+e.message);
    }

    if(transcript){
      log('Recognized: '+transcript);
      document.getElementById('status').textContent='已识别: '+transcript;
      await doTranslate(transcript);
    }else{
      // Fallback: use Web Speech API if available
      log('Google STT failed, trying Web Speech...');
      document.getElementById('status').textContent='识别失败，请用键盘🎤或手动输入';
      toast('语音识别失败，请手动输入');
    }
  }catch(e){
    log('STT error: '+e.message);
    document.getElementById('status').textContent='识别出错，请手动输入';
    toast('识别出错: '+e.message);
  }
}

// ===== SPEAK =====
function speak(text,lang){
  log('Speaking: '+text.substring(0,30));
  document.getElementById('speakBtn').textContent='🔊 播放中...';

  // Method 1: Browser SpeechSynthesis
  const synth=window.speechSynthesis;
  if(synth){
    synth.cancel();
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang=lang==='ko'?'ko-KR':'zh-CN';
    utter.rate=0.85;
    utter.onend=()=>{document.getElementById('speakBtn').textContent='🔊 朗读'};
    utter.onerror=()=>{
      log('Browser TTS failed, trying Google TTS...');
      speakViaGoogle(text,lang);
    };
    synth.speak(utter);
    // Timeout fallback
    setTimeout(()=>{
      if(document.getElementById('speakBtn').textContent==='🔊 播放中...'){
        log('Browser TTS timeout, trying Google TTS...');
        synth.cancel();
        speakViaGoogle(text,lang);
      }
    },4000);
  }else{
    speakViaGoogle(text,lang);
  }
}

function speakViaGoogle(text,lang){
  log('Google TTS for: '+text.substring(0,30));
  const chunks=[];
  for(let i=0;i<text.length;i+=180)chunks.push(text.slice(i,i+180));

  let idx=0;
  function playNext(){
    if(idx>=chunks.length){
      document.getElementById('speakBtn').textContent='🔊 朗读';
      return;
    }
    const url=`https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(chunks[idx++])}`;
    const a=new Audio(url);
    a.onended=playNext;
    a.onerror=()=>{
      log('Google TTS chunk failed, trying alt');
      speakViaAlt(idx<chunks.length?chunks.slice(idx-1).join(' '):text,lang);
    };
    a.play().catch(()=>{
      log('Google TTS play failed');
      speakViaAlt(text,lang);
    });
  }
  playNext();
}

function speakViaAlt(text,lang){
  log('Alt TTS');
  const url=`https://api.streamelements.com/kappa/v2/speech?voice=${lang==='ko'?'Korean Female':'Chinese Female'}&text=${encodeURIComponent(text)}`;
  const a=new Audio(url);
  a.onended=()=>{document.getElementById('speakBtn').textContent='🔊 朗读'};
  a.onerror=()=>{
    document.getElementById('speakBtn').textContent='🔊 朗读';
    toast('朗读失败，请检查手机TTS设置');
  };
  a.play().catch(()=>{
    document.getElementById('speakBtn').textContent='🔊 朗读';
    toast('朗读失败');
  });
}

function speakResult(){
  if(!currentResult){toast('还没有翻译结果');return;}
  const lang=mode==='zh2ko'?'ko':'zh-CN';
  speak(currentResult,lang==='zh-CN'?'zh':'ko');
}

// ===== HISTORY =====
function addHist(orig,tran){
  hist.unshift({orig,tran,mode,time:Date.now()});
  if(hist.length>20)hist.length=20;
  try{localStorage.setItem('kt2_hist',JSON.stringify(hist))}catch(e){}
  renderHist();
}
function renderHist(){
  const w=document.getElementById('histWrap'),l=document.getElementById('histList');
  if(!hist.length){w.style.display='none';return}
  w.style.display='block';
  l.innerHTML=hist.slice(0,10).map(h=>`<div class="hist-item" onclick="replay('${h.orig.replace(/'/g,"\'")}','${h.tran.replace(/'/g,"\'")}','${h.mode}')"><div class="orig">${h.orig}</div><div class="tran">${h.tran}</div></div>`).join('');
}
function replay(orig,tran,m){currentResult=tran;if(m!==mode)setMode(m);document.getElementById('resultArea').style.display='block';document.getElementById('resultText').textContent=tran}
function clearHist(){hist=[];localStorage.removeItem('kt2_hist');renderHist()}
function copyResult(){if(!currentResult)return;navigator.clipboard.writeText(currentResult).then(()=>toast('已复制')).catch(()=>toast('复制失败'))}

// ===== INIT =====
function init(){
  log('Init');
  // Test mic availability
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
      s.getTracks().forEach(t=>t.stop());
      log('Mic OK, ready');
    }).catch(e=>{
      log('Mic denied: '+e.message);
      document.getElementById('recLabel').textContent='麦克风不可用';
      document.getElementById('recBtn').style.opacity='0.4';
    });
  }else{
    log('No mediaDevices');
    document.querySelector('.rec-wrap').style.display='none';
  }

  // Load voices
  const s=window.speechSynthesis;
  if(s){s.getVoices();if(s.onvoiceschanged!==undefined)s.onvoiceschanged=()=>s.getVoices()}

  document.getElementById('textInput').focus();
  renderHist();
}
init();
</script>
</body>
</html>
