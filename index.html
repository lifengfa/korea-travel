<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇰🇷 한국고고고 · 首尔旅行控制台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#0a0a0f;color:#e0d8d0;min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{background:#111118;border-bottom:1px solid #1e1e2a;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.logo{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#ff6b8a,#ff9a56,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stats{display:flex;gap:1.5rem;font-size:.85rem}
.stat{padding:.3rem .8rem;border-radius:20px;font-weight:500}
.stat-done{background:rgba(46,213,115,.12);color:#2ed573}
.stat-progress{background:rgba(88,166,255,.12);color:#58a6ff}
.stat-todo{background:rgba(255,107,138,.12);color:#ff6b8a}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid #1e1e2a;background:#0d0d14}
.tab{padding:.8rem 2rem;cursor:pointer;border:none;background:none;color:#6a6a7a;font-size:.9rem;font-weight:500;transition:all .3s;border-bottom:2px solid transparent;font-family:inherit}
.tab:hover{color:#c0b8b0}
.tab.active{color:#ff9a56;border-bottom-color:#ff9a56;background:rgba(255,154,86,.04)}

/* CONTENT */
.content{padding:1.5rem 2rem}
.panel{display:none}
.panel.active{display:block}

/* KANBAN */
.kanban{display:flex;gap:1rem;overflow-x:auto;padding-bottom:1rem}
.kanban-col{min-width:300px;flex:1;background:#111118;border:1px solid #1e1e2a;border-radius:12px}
.col-header{padding:.8rem 1rem;font-weight:600;font-size:.9rem;border-bottom:1px solid #1e1e2a;display:flex;justify-content:space-between;align-items:center}
.col-body{padding:.6rem;min-height:200px;display:flex;flex-direction:column;gap:.5rem}
.card{background:#171722;border:1px solid #222230;border-radius:8px;padding:.75rem;cursor:grab;transition:all .2s;font-size:.85rem;display:flex;align-items:center;gap:.6rem}
.card:hover{border-color:rgba(255,107,138,.3);transform:translateY(-1px)}
.card .emoji{font-size:1.2rem;flex-shrink:0}
.card .text{line-height:1.4}
.card select{background:#222;color:#e0d8d0;border:1px solid #333;border-radius:4px;padding:.2rem .4rem;font-size:.75rem;margin-left:auto;cursor:pointer}

/* GANTT */
.gantt{overflow-x:auto}
.gantt-row{display:flex;align-items:center;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.82rem}
.gantt-label{width:240px;flex-shrink:0;padding-right:1rem}
.gantt-track{flex:1;position:relative;height:32px;background:rgba(255,255,255,.02);border-radius:4px}
.gantt-bar{position:absolute;top:4px;height:24px;border-radius:4px;opacity:.85;transition:opacity .2s;cursor:pointer;display:flex;align-items:center;padding:0 6px;font-size:.7rem;overflow:hidden;white-space:nowrap}
.gantt-bar:hover{opacity:1}
.gantt-bar.d1{background:linear-gradient(90deg,#667eea,#764ba2);left:0%;width:15%}
.gantt-bar.d2{background:linear-gradient(90deg,#f093fb,#f5576c);left:15%;width:20%}
.gantt-bar.d3{background:linear-gradient(90deg,#4facfe,#00f2fe);left:35%;width:20%}
.gantt-bar.d4{background:linear-gradient(90deg,#43e97b,#38f9d7);left:55%;width:20%}
.gantt-bar.d5{background:linear-gradient(90deg,#fa709a,#fee140);left:75%;width:20%}
.gantt-bar.prep{background:linear-gradient(90deg,#a18cd1,#fbc2eb);left:0%;width:15%;opacity:.5}
.gantt-header{display:flex;margin-bottom:.5rem;font-size:.7rem;color:#6a6a7a}
.gantt-header span{flex:1;text-align:center}

/* CHECKLIST */
.check-section{margin-bottom:2rem}
.check-section h3{font-size:1.1rem;margin-bottom:.8rem;color:#ff9a56}
.check-item{display:flex;align-items:center;gap:.7rem;padding:.5rem .8rem;border-radius:8px;transition:all .2s;cursor:pointer;font-size:.9rem}
.check-item:hover{background:rgba(255,255,255,.03)}
.check-item input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid #444;border-radius:4px;cursor:pointer;flex-shrink:0;position:relative}
.check-item input[type=checkbox]:checked{border-color:#2ed573;background:#2ed573}
.check-item input[type=checkbox]:checked::after{content:'✓';position:absolute;top:-1px;left:4px;color:#0a0a0f;font-weight:700}
.check-item.done{opacity:.5;text-decoration:line-through}

/* ITINERARY */
.day-card{background:#111118;border:1px solid #1e1e2a;border-radius:12px;padding:1.5rem;margin-bottom:1rem;transition:all .3s}
.day-card:hover{border-color:rgba(255,107,138,.25)}
.day-card h3{font-size:1.2rem;margin-bottom:.5rem}
.day-card .meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem;margin-top:.8rem}
.meal{border-left:3px solid;padding:.4rem .8rem;font-size:.85rem;border-radius:0 6px 6px 0}
.meal.breakfast{border-color:#ffd93d;background:rgba(255,217,61,.06)}
.meal.lunch{border-color:#ff9a56;background:rgba(255,154,86,.06)}
.meal.dinner{border-color:#8a4fff;background:rgba(138,79,255,.06)}
.meal.activity{border-color:#58a6ff;background:rgba(88,166,255,.06)}

/* PROGRESS BAR */
.progress-bar{height:4px;background:#1e1e2a;border-radius:2px;margin:1rem 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2ed573,#58a6ff,#ff6b8a);border-radius:2px;transition:width .5s}

@media(max-width:768px){.kanban{flex-direction:column}.kanban-col{min-width:auto}.gantt-label{width:120px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🇰🇷 한국고고고</div>
  <div class="stats">
    <span class="stat stat-done" id="statDone">✅ 6</span>
    <span class="stat stat-progress" id="statProgress">🔄 0</span>
    <span class="stat stat-todo" id="statTodo">⬜ 38</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('kanban')">📋 看板</button>
  <button class="tab" onclick="switchTab('gantt')">📅 甘特图</button>
  <button class="tab" onclick="switchTab('checklist')">✅ 清单</button>
  <button class="tab" onclick="switchTab('itinerary')">🎨 行程</button>
</div>

<div class="content">

  <!-- ═══════ KANBAN ═══════ -->
  <div class="panel active" id="panel-kanban">
    <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:14%"></div></div>
    <div class="kanban">
      <div class="kanban-col">
        <div class="col-header">⬜ 待办 <span id="todoCount" style="color:#ff6b8a">38</span></div>
        <div class="col-body" id="colTodo"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header">🔄 进行中 <span id="inProgressCount" style="color:#58a6ff">0</span></div>
        <div class="col-body" id="colProgress"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header">✅ 已完成 <span id="doneCount" style="color:#2ed573">6</span></div>
        <div class="col-body" id="colDone"></div>
      </div>
    </div>
  </div>

  <!-- ═══════ GANTT ═══════ -->
  <div class="panel" id="panel-gantt">
    <div class="gantt-header">
      <span style="width:240px;flex-shrink:0"></span>
      <span>准备</span><span>Day1 7.9</span><span>Day2 7.10</span><span>Day3 7.11</span><span>Day4 7.12</span><span>Day5 7.13</span>
    </div>
    <div id="ganttContent"></div>
  </div>

  <!-- ═══════ CHECKLIST ═══════ -->
  <div class="panel" id="panel-checklist">
    <div class="progress-bar"><div class="progress-fill" id="checkProgress" style="width:14%"></div></div>
    <div id="checkContent"></div>
  </div>

  <!-- ═══════ ITINERARY ═══════ -->
  <div class="panel" id="panel-itinerary">
    <div id="itinContent"></div>
  </div>

</div>

<script>
// ═══════ DATA ═══════
const TASKS = [

  {id:3, emoji:'💰', text:'现金 ₩', cat:'准备', status:'done', day:0},

  {id:18, emoji:'🏨', text:'入住酒店休息', cat:'Day1', status:'todo', day:1},
  {id:19, emoji:'🍲', text:'麻浦阳地雪浓汤', cat:'Day2', status:'todo', day:2},
  {id:20, emoji:'🛍️', text:'明洞逛街', cat:'Day2', status:'todo', day:2},
  {id:21, emoji:'🍗', text:'炸鸡 60', cat:'Day2', status:'todo', day:2},
  {id:22, emoji:'🎤', text:'17:00 演唱会!!! ⭐', cat:'Day2', status:'todo', day:2},
  {id:23, emoji:'🍕', text:'外卖：炒年糕+披萨', cat:'Day2', status:'todo', day:2},
  {id:24, emoji:'🐔', text:'参鸡汤 / Fritz', cat:'Day3', status:'todo', day:3},
  {id:25, emoji:'🛍️', text:'汝矣岛现代百货', cat:'Day3', status:'todo', day:3},
  {id:26, emoji:'🐂', text:'소곱창 牛肠', cat:'Day3', status:'todo', day:3},
  {id:27, emoji:'🌅', text:'汉江公园日落', cat:'Day3', status:'todo', day:3},
  {id:28, emoji:'🍻', text:'Hansabal 大排档', cat:'Day3', status:'todo', day:3},
  {id:29, emoji:'💄', text:'Olive Young 扫货', cat:'Day3', status:'todo', day:3},
  {id:30, emoji:'🍔', text:'Mom\'s Touch 汉堡', cat:'Day4', status:'todo', day:4},
  {id:31, emoji:'🛍️', text:'圣水洞逛街', cat:'Day4', status:'todo', day:4},
  {id:32, emoji:'🥩', text:'水芹菜牛肉饭汤', cat:'Day4', status:'todo', day:4},
  {id:33, emoji:'🛍️', text:'狎鸥亭逛街', cat:'Day4', status:'todo', day:4},
  {id:34, emoji:'🍖', text:'脊骨汤 (孔德)', cat:'Day4', status:'todo', day:4},
  {id:35, emoji:'⏰', text:'8:00 起床', cat:'Day5', status:'todo', day:5},
  {id:36, emoji:'🏪', text:'CU/GS25 便利店', cat:'Day5', status:'todo', day:5},
  {id:37, emoji:'🚕', text:'出发去机场', cat:'Day5', status:'todo', day:5},
  {id:38, emoji:'🛍️', text:'免税店+提货', cat:'Day5', status:'todo', day:5},
  {id:39, emoji:'✈️', text:'13:10 仁川起飞', cat:'Day5', status:'todo', day:5},
  {id:40, emoji:'💳', text:'刷汇率优惠', cat:'提醒', status:'todo', day:0},
  {id:41, emoji:'📱', text:'手机挂绳不离身', cat:'提醒', status:'todo', day:0},
  {id:42, emoji:'🗑️', text:'垃圾袋随身带', cat:'提醒', status:'todo', day:0},
  {id:43, emoji:'🧻', text:'多拿抽纸', cat:'提醒', status:'todo', day:0},
  {id:44, emoji:'📲', text:'KakaoMap > Google', cat:'提醒', status:'todo', day:0},
];

// Load from localStorage
let tasks = JSON.parse(localStorage.getItem('koreaTasks')) || TASKS;

function save(){ localStorage.setItem('koreaTasks', JSON.stringify(tasks)); updateStats(); }

function updateStats(){
  let d = tasks.filter(t=>t.status==='done').length;
  let p = tasks.filter(t=>t.status==='progress').length;
  let t = tasks.filter(t=>t.status==='todo').length;
  document.getElementById('statDone').textContent = '✅ '+d;
  document.getElementById('statProgress').textContent = '🔄 '+p;
  document.getElementById('statTodo').textContent = '⬜ '+t;
  let pct = Math.round((d/tasks.length)*100);
  document.querySelectorAll('.progress-fill').forEach(el=>el.style.width=pct+'%');
}

function changeStatus(id, newStatus){
  let t = tasks.find(t=>t.id===id);
  if(t){ t.status = newStatus; save(); renderAll(); }
}

// ═══════ RENDER ═══════
function renderKanban(){
  ['todo','progress','done'].forEach(s=>{
    let col = document.getElementById(s==='todo'?'colTodo':s==='progress'?'colProgress':'colDone');
    let items = tasks.filter(t=>t.status===s);
    col.innerHTML = items.map(t=>`
      <div class="card">
        <span class="emoji">${t.emoji}</span>
        <span class="text">${t.text}</span>
        <select onchange="changeStatus(${t.id},this.value)">
          <option value="todo" ${s==='todo'?'selected':''}>⬜</option>
          <option value="progress" ${s==='progress'?'selected':''}>🔄</option>
          <option value="done" ${s==='done'?'selected':''}>✅</option>
        </select>
      </div>`).join('');
    document.getElementById(s==='todo'?'todoCount':s==='progress'?'inProgressCount':'doneCount').textContent = items.length;
  });
}

function renderGantt(){
  let days = ['','准备','Day1 7.9','Day2 7.10','Day3 7.11','Day4 7.12','Day5 7.13'];
  let cats = ['准备','Day1','Day2','Day3','Day4','Day5','提醒'];
  let html = '';
  cats.forEach(cat=>{
    let catTasks = tasks.filter(t=>t.cat===cat);
    if(!catTasks.length) return;
    html += '<div class="gantt-row">';
    html += `<div class="gantt-label">${cat}</div>`;
    html += '<div class="gantt-track">';
    catTasks.forEach(t=>{
      let day = t.day;
      let cls = day===0?'prep':'d'+day;
      let left = day===0?0:((day-1)*20+15);
      html += `<div class="gantt-bar ${cls}" style="left:${left}%" title="${t.emoji} ${t.text}">${t.emoji} ${t.text.slice(0,8)}</div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('ganttContent').innerHTML = html;
}

function renderChecklist(){
  let sections = [
    {title:'✅ 已完成 (出发前)', cat:'准备', filter:t=>t.status==='done'},
    {title:'⬜ 出发前待办', cat:'准备', filter:t=>t.status!=='done'},
    {title:'🗺️ Day 1-5 行程事项', cat:'Day1|Day2|Day3|Day4|Day5', filter:()=>true},
    {title:'🚨 重要提醒', cat:'提醒', filter:()=>true},
  ];
  let html = '';
  sections.forEach(sec=>{
    let cats = sec.cat.split('|');
    let items = tasks.filter(t=>cats.includes(t.cat) && sec.filter(t));
    if(!items.length) return;
    html += `<div class="check-section"><h3>${sec.title}</h3>`;
    items.forEach(t=>{
      html += `<label class="check-item ${t.status==='done'?'done':''}">
        <input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleTask(${t.id},this.checked)">
        <span>${t.emoji} ${t.text}</span>
      </label>`;
    });
    html += '</div>';
  });
  document.getElementById('checkContent').innerHTML = html;
}

function toggleTask(id, checked){
  let t = tasks.find(t=>t.id===id);
  if(t){ t.status = checked?'done':'todo'; save(); renderChecklist(); renderKanban(); }
}

function renderItinerary(){
  let days = [
    {n:1,date:'7.9 周四',title:'🌴 抵达首尔',items:[
      {type:'activity',text:'✈️ 18:45 仁川 T1 到达'},
      {type:'dinner',text:'🥩 Gop 烤肉 / 高度食烤肉'},
      {type:'activity',text:'🏨 入住酒店 + 休息'},
    ]},
    {n:2,date:'7.10 周五',title:'🌴 明洞 + 🎵演唱会',items:[
      {type:'breakfast',text:'🍲 麻浦阳地雪浓汤'},
      {type:'activity',text:'🛍️ 明洞逛街'},
      {type:'lunch',text:'🍗 炸鸡 60'},
      {type:'activity',text:'🎤 17:00 演唱会!!! ⭐'},
      {type:'dinner',text:'🍕 外卖：罗杰炒年糕+披萨'},
    ]},
    {n:3,date:'7.11 周六',title:'🌴 汝矣岛 + 汉江 + 弘大',items:[
      {type:'breakfast',text:'🐔 参鸡汤 / Fritz 烘焙'},
      {type:'activity',text:'🛍️ 汝矣岛现代百货'},
      {type:'lunch',text:'🐂 소곱창 牛肠'},
      {type:'activity',text:'🌅 汉江公园看日落'},
      {type:'dinner',text:'🍻 Hansabal 大排档（弘大）'},
      {type:'activity',text:'💄 Olive Young 扫货'},
    ]},
    {n:4,date:'7.12 周日',title:'🌴 圣水洞 + 狎鸥亭',items:[
      {type:'breakfast',text:'🍔 Mom\'s Touch 汉堡'},
      {type:'activity',text:'🛍️ 圣水洞（网红咖啡·买手店）'},
      {type:'lunch',text:'🥩 水芹菜牛肉饭汤'},
      {type:'activity',text:'🛍️ 狎鸥亭（设计师品牌）'},
      {type:'dinner',text:'🍖 양천뼈다귀 脊骨汤'},
    ]},
    {n:5,date:'7.13 周一',title:'🌴 返程',items:[
      {type:'activity',text:'⏰ 8:00 起床'},
      {type:'breakfast',text:'🏪 CU/GS25 便利店'},
      {type:'activity',text:'🚕 出发去仁川机场'},
      {type:'activity',text:'🛍️ 免税店 + 提货'},
      {type:'activity',text:'✈️ 13:10 仁川 T1 起飞'},
    ]},
  ];
  document.getElementById('itinContent').innerHTML = days.map(d=>`
    <div class="day-card">
      <h3>${d.title} <span style="font-size:.8rem;color:#8b8b9a">${d.date}</span></h3>
      <div class="meals">${d.items.map(i=>`
        <div class="meal ${i.type}">${i.text}</div>
      `).join('')}</div>
    </div>
  `).join('');
}

function renderAll(){ renderKanban(); renderGantt(); renderChecklist(); renderItinerary(); updateStats(); }

// ═══════ TAB SWITCH ═══════
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${{kanban:1,gantt:2,checklist:3,itinerary:4}[name]})`).classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

// ═══════ INIT ═══════
renderAll();
</script>
</body>
</html>
